<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3987e5"/>
      <stop offset="1" stop-color="#184f95"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <!-- rising bars behind the euro sign: tracking money over time -->
  <rect x="44" y="156" width="36" height="56" rx="8" fill="#ffffff" opacity="0.22"/>
  <rect x="110" y="120" width="36" height="92" rx="8" fill="#ffffff" opacity="0.22"/>
  <rect x="176" y="80" width="36" height="132" rx="8" fill="#ffffff" opacity="0.22"/>
  <text x="128" y="170" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-weight="700" font-size="150" fill="#ffffff">€</text>
</svg>
